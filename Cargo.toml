[patch.crates-io]
# `thread_aware` depends on a compatible published version of this package. Resolve that transitive
# requirement to the workspace package so Cargo package selectors remain unambiguous.
# Registry and path packages remain distinct identities even when their names and versions match.
nm = { path = "packages/nm" }

[profile.release]
# This ensures we have high quality data with proper stack traces when profiling.
debug = "line-tables-only"

[profile.test]
# This is supposed to be the default (inherited from "dev") but in practice,
# fails to be so when running llvm-cov to measure test coverage. Explicitly
# specifying this here to ensure we always have proper errors and stack traces.
debug = "full"

[profile.mutants]
inherits = "test"
# Speed up the build.
debug = "none"
incremental = false

# Best-case benchmarking profile used by `just bench-best`. `cargo bench` defaults to the built-in
# `bench` profile (which mirrors `release`: opt-level 3, no LTO, 16 codegen units); this inherits
# the same `release` base and turns on whole-program optimization - fat LTO across a single codegen
# unit - to squeeze out the fastest code the standard pipeline produces. It is deliberately NOT
# used for the tracked `just bench` history: those numbers must stay comparable over time, and the
# stability recipes instead force function alignment. See justfiles/just_testing.just.
[profile.bench-best]
inherits = "release"
lto = "fat"
codegen-units = 1
