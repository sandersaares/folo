ohno = { version = "0.5.0", default-features = false }
oneshot = { version = "0.2.1", default-features = false, features = [
    "std",
    "async",
] }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-stdout = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
pastey = { version = "0.2.3", default-features = false }
pin-project = { version = "1.1.0", default-features = false }
# The figure generator for the cargo-bench-history book renders SVG only. The default
# features are off because they select the `font-kit` text backend, which resolves fonts
# from the host system - that would make generated figure bytes machine-dependent and
# break the checked-in-figures freshness check. The SVG backend emits `<text>` elements
# and leaves glyph rendering to the browser, so it needs no font library at all.
plotters = { version = "0.3.7", default-features = false }
plurality = { version = "0.2.2", default-features = false, features = ["std"] }
proc-macro2 = { version = "1.0.106", default-features = false }
quote = { version = "1.0.45", default-features = false }
rand = { version = "0.10.1", default-features = false, features = ["std"] }
rasciigraph = { version = "0.3.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rsevents = { version = "0.3.1", default-features = false }
scc = { version = "3.0.2", default-features = false }
scopeguard = { version = "1.2.0", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
seq-macro = { version = "0.3.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
serial_test = { version = "4.0.1", default-features = false }
