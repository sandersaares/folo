# Cargo packages that form one logical unit belong to one version group, and the
# members of a version group must share a version. cargo-release-plan expands an
# increment across every member of a version group and rewrites intra-workspace
# `=` pins together. Ref: docs/impl-crate-split.md.
#
# These version groups must stay in sync with the `version_group` keys in
# release-plz.toml, which release-plz reads for the same purpose.
[workspace.metadata.release-plan.groups]
cargo-bench-history = [
    "cargo-bench-history",
    # Test-support package that is not an implementation dependency of the CLI.
    # It belongs to this group so a faker-only change may increment the whole family.
    "cargo-bench-history-faker",
    "cbh_analyze",
    "cbh_cli",
    "cbh_codec",
    "cbh_command",
    "cbh_config",
    "cbh_detect",
    "cbh_diag",
    "cbh_engines",
    "cbh_git",
    "cbh_model",
    "cbh_probe",
    "cbh_render",
    "cbh_stats",
    "cbh_storage",
]
linked = ["linked", "linked_macros", "linked_macros_impl"]
many_cpus = ["many_cpus", "many_cpus_impl"]
nm = ["nm", "nm_impl"]
nm_otel = ["nm_otel", "nm_otel_impl"]

[workspace.metadata.cargo-udeps.ignore]
development = ["mutants", "static_assertions"]

[workspace.lints.rust]
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
