# Fixture release-plz config for exercising New-ReleasePlzConfig / Add-GitReleaseEnableFlag.
# The [workspace] defaults follow the committed config (releases off at the workspace level).
# The [[package]] blocks are synthetic: the committed config has no package entries, and these
# exist so the tests can exercise injection into an existing block, preservation of an unrelated
# sibling key (changelog_update), and exact-name matching that must not touch the name-prefix
# sibling (demo-tool-core). A crate with no entry here (e.g. pub-bin) gets a fresh block.
[workspace]
git_release_enable = false
allow_dirty = true

[[package]]
name = "demo-tool"
changelog_update = false

[[package]]
name = "demo-tool-core"
changelog_update = false
