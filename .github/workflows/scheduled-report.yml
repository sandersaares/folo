name: Scheduled reporting

on:
  workflow_run:
    workflows: [Full deep validation, Selected deep validation]
    types: [completed]

concurrency:
  # Serialize retries of one attempt without blocking reports for other runs.
  # Ref: .github/workflows/implementation.md#failure-reporting.
  group: scheduled-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'folo-rs/folo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted default-branch reporter
        # Candidate diagnostics cannot choose the controller or overwrite its checkout.
        # Ref: .github/workflows/implementation.md#failure-reporting.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: controller
          persist-credentials: false
      - name: Report the completed attempt
        # Reporting has no Rust or deep-environment setup prerequisite.
        # Only this completion controller has issue-write authority.
        # Ref: .github/workflows/implementation.md#failure-reporting.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./controller/scripts/scheduled/Invoke-ScheduledReport.ps1
      - uses: actions/upload-artifact@v6
        # These files supplement the readable issue and help diagnose reporter failures.
        # Recovery reruns this reporter, not validation or a separate health workflow.
        # Ref: .github/workflows/implementation.md#failure-reporting.
        if: always()
        with:
          name: scheduled-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
