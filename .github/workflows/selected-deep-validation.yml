name: Selected deep validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to test; leave blank for this main event. Keep Use workflow from set to main.
        required: false
        type: string
      check_ids:
        description: Check IDs separated by commas (for example miri-ubuntu-latest); see docs/scheduled-validation.md
        required: true
        type: string
      packages:
        description: Crate names separated by commas (for example cpulist)
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'folo-rs/folo'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Manual source selection never replaces the event-pinned main controller.
      # Ref: .github/workflows/implementation.md#immutable-execution.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan fresh selected checks
        id: plan
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledPlan.ps1 -Mode selected
      # Preserve scope independently of the candidate's ability to build.
      # Ref: .github/workflows/implementation.md#failure-reporting.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scheduled-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-plan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  checks:
    needs: plan
    uses: ./.github/workflows/deep-checks.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      controller_sha: ${{ needs.plan.outputs.controller_sha }}
      matrix: ${{ needs.plan.outputs.matrix }}
