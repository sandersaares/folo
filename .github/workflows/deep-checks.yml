name: Deep checks

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions:
  # Candidate builds never share the reporter's issue-write authority.
  # Ref: .github/workflows/implementation.md#immutable-execution.
  contents: read

jobs:
  execute:
    name: ${{ matrix.id }}
    # Independent checks still run after a finding; every nonzero exit fails its matrix job.
    # Ref: .github/workflows/design.md#scheduled-validation.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    # Mutation work needs its execution allowance plus cold-cache setup time.
    # Ref: .github/workflows/implementation.md#immutable-execution.
    timeout-minutes: 270
    steps:
      # Setup and argument construction belong to the pinned controller, not candidate edits.
      # The separate source checkout binds tested bytes without replacing that authority.
      # Ref: .github/workflows/implementation.md#immutable-execution.
      - name: Checkout immutable controller
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.controller_sha }}
          persist-credentials: false
      - name: Setup environment from controller
        uses: ./.github/actions/setup-environment
      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Execute declared check
        # Native exit codes and incomplete execution fail the job, not just its artifact.
        # Ref: .github/workflows/implementation.md#immutable-execution.
        shell: pwsh
        env:
          SCHEDULED_CHECK: ${{ toJSON(matrix) }}
          SCHEDULED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just scheduled-check
      - name: Preserve readable summary and tool diagnostics
        # Always upload partial diagnostics; setup-only failures remain visible in Actions logs.
        # Ref: .github/workflows/implementation.md#failure-reporting.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .scheduled-result
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
