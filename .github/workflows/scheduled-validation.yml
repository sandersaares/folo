name: Scheduled validation

on:
  schedule:
    - cron: 41 2 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue expensive full runs rather than duplicating or cancelling evidence collection.
  # Ref: .github/workflows/implementation.md#complete-evidence-and-reuse.
  group: scheduled-validation
  cancel-in-progress: false

jobs:
  plan:
    # The planner rejects a non-main workflow selection with instructions rather than skipping.
    # Ref: .github/workflows/implementation.md#immutable-execution.
    if: github.repository == 'folo-rs/folo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - name: Checkout scheduled immutable main
        # The event SHA binds the plan to one source/controller, even if main advances.
        # Ref: .github/workflows/implementation.md#immutable-execution.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan fresh manual checks or reusable automatic checks
        # Reuse requires compatible full success and no unsettled/newer failure; skips do not
        # renew success age or imply authorization to run the personal repair worker.
        # Ref: .github/workflows/implementation.md#complete-evidence-and-reuse.
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledPlan.ps1
      - name: Preserve expected scope even when checks are not run
        # Reporting must distinguish an intentional skip from incomplete evidence.
        # Ref: .github/workflows/implementation.md#complete-evidence-and-reuse.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-plan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  checks:
    # A disabled or compatibly covered plan is a legitimate skip, not fresh checker success.
    # Ref: .github/workflows/implementation.md#operating-policy.
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/deep-checks.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      controller_sha: ${{ needs.plan.outputs.controller_sha }}
      matrix: ${{ needs.plan.outputs.matrix }}
      manifest: ${{ needs.plan.outputs.manifest }}
