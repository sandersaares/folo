name: Scheduled health

on:
  schedule:
    - cron: 11 */3 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe scheduler, reporter, coverage and local intake independently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledHealth.ps1
      - name: Preserve independent health observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-health
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
