name: Full deep validation

on:
  schedule:
    - cron: 41 2 * * *
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to test; leave blank for this main event. Keep Use workflow from set to main.
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'folo-rs/folo'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Resolve neither moving main nor candidate scripts during execution planning.
      # Ref: .github/workflows/implementation.md#immutable-execution.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan fresh full checks
        id: plan
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledPlan.ps1 -Mode full
      # The reporter can identify manually selected source bytes even if checker setup fails.
      # Ref: .github/workflows/implementation.md#failure-reporting.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scheduled-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-plan
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  checks:
    # Every nightly event executes the full catalog, including when main has not changed.
    # Ref: .github/workflows/design.md#scheduled-validation.
    needs: plan
    uses: ./.github/workflows/deep-checks.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      controller_sha: ${{ needs.plan.outputs.controller_sha }}
      matrix: ${{ needs.plan.outputs.matrix }}
