name: Setup Environment
description: Setup development environment for Folo project

inputs:
  install-azurite:
    description: >-
      Whether `just install-tools` should also install the Azurite blob-storage emulator.
      Off by default because only the test-azurite job needs it and its npm install adds
      ~3 minutes; that job opts back in by setting this to "true". azcopy is never installed
      in CI (only the on-demand `just bench-history-stress-azure` uses it), so it has no input.
    required: false
    default: "false"
  install-valgrind:
    description: >-
      Whether the Linux APT install should also include valgrind. Off by default because only
      the jobs that actually execute Callgrind benchmarks need it, and valgrind drags in
      libc6-dbg - a package pinned by an EXACT version relation to the image's libc6. Any Ubuntu
      glibc security update therefore invalidates the previously installed debug symbols, and
      installing valgrind everywhere would let that routine update take down clippy, docs, miri
      and mutants across the whole repository. Jobs that run Callgrind opt back in by setting
      this to "true". A job declares the requirement, not the platform: only Linux-gated steps
      read this input, so a multi-OS job sets it unconditionally and its Windows and macOS legs
      ignore it. Repeating a `runner.os` condition at the call sites would duplicate a decision
      this action already owns, and would suppress the request on any platform that later grows
      a valgrind install path of its own.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve runner image version (Linux)
      # Feeds the runner image version into the APT cache key below. GitHub-hosted runners set
      # ImageVersion (e.g. 20260810.271) on every job, but a composite action's `with:` block
      # cannot be relied on to resolve the `env` context, whereas the `steps` context always
      # resolves - so the value is exported as a step output instead. Fail loudly when it is
      # absent rather than emitting an empty string, because an empty key component would
      # silently restore the image-independent cache this step exists to eliminate.
      id: image
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -z "$ImageVersion" ]; then
          echo "ImageVersion is not set; the APT cache cannot be scoped to the runner image." >&2
          exit 1
        fi
        echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Refresh APT package index (Linux)
      # cache-apt-pkgs-action never refreshes the index (its `refresh` input is documented as
      # obsolete), so on a cache miss it resolves package versions from the index baked into
      # the runner image at image build time. Ubuntu withdraws superseded packages from the
      # archive when it publishes an update, so an index that predates one resolves a version
      # that no longer exists and the download 404s.
      #
      # This applies to every package requested below, not only valgrind, so the refresh is
      # unconditional on Linux. build-essential and cmake are NOT preinstalled: the Ubuntu
      # image README lists neither in its apt package inventory, and the CMake it does ship is
      # an upstream build under /usr/local, unrelated to the archive's `cmake` package that
      # this step installs together with cmake-data, libjsoncpp25 and librhash0. Scoping the
      # cache key to the image version (see below) also means every image roll forces exactly
      # that fresh resolve on every Linux job, so gating the refresh on the valgrind opt-in
      # would leave the other jobs one archive update away from the same 404.
      if: runner.os == 'Linux'
      shell: bash
      # Acquire::Retries covers a transient mirror blip in place, matching the workspace stance
      # that a single infrastructure fault must not drop a whole job (see workflows/design.md).
      run: sudo apt-get update -o Acquire::Retries=3

    - name: Install APT packages (Linux)
      # The GitHub-hosted Ubuntu images already ship git, git-lfs, gcc, make, curl,
      # libssl-dev, pkg-config and PowerShell (apt reports them "already the newest"), so
      # only build-essential, cmake and - where a job opts in - valgrind, plus their
      # dependencies, are genuinely installed here. Package downloads are not the bottleneck
      # (~1s for tens of MB on the Azure mirrors); the cost is the `apt-get update` index
      # refresh and the dpkg unpack/configure. cache-apt-pkgs-action restores the
      # already-configured files from an actions/cache entry and skips apt entirely on a hit,
      # cutting this step from ~15s (amd64) / ~26s (arm64) to a few seconds. The action is in
      # upstream maintenance mode, so `@v1` only rolls forward to backward-compatible fixes
      # within its major line - there is no breaking v2 to chase.
      #
      # execute_install_scripts runs each package's postinst (e.g. ldconfig) on restore so
      # valgrind's shared-library dependencies resolve.
      #
      # The action's own cache key hashes only the requested package names and the arch, so it
      # cannot see that valgrind's libc6-dbg carries detached glibc debug symbols that are only
      # valid against the exact libc6 build present on the image. A cache hit after a glibc
      # update would then restore stale symbols and valgrind would abort at startup. Scoping
      # the key to the runner image version makes the cache roll forward with the image
      # automatically; the leading literal is a manual bust knob, bumped to discard every
      # existing entry deliberately.
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: ${{ inputs.install-valgrind == 'true' && 'build-essential cmake valgrind' || 'build-essential cmake' }}
        version: 1-${{ steps.image.outputs.version }}
        execute_install_scripts: true

    - name: Install PowerShell (Linux ARM64)
      # amd64 Ubuntu runners preinstall PowerShell, but the arm64 images do not ship a pwsh
      # the packages.microsoft.com apt repo can satisfy - that repo only publishes amd64
      # packages, so `apt install powershell` fails on arm64 with "Depends: libc6:amd64 but
      # it is not installable". Microsoft instead ships arm64 PowerShell as a tarball on the
      # PowerShell GitHub releases page, which we install here. --retry-all-errors covers
      # transient TLS failures against GitHub during early boot.
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        set -x
        # Pinned to a current LTS release. Bump as newer 7.4.x patches ship.
        PWSH_VERSION="7.4.6"
        curl --fail --silent --show-error --location \
          --retry 5 --retry-delay 2 --retry-all-errors \
          --output /tmp/powershell.tar.gz \
          "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-arm64.tar.gz"
        sudo mkdir -p /opt/microsoft/powershell/7
        sudo tar zxf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/7
        sudo chmod +x /opt/microsoft/powershell/7/pwsh
        sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh

    - name: Configure Git LFS (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: git lfs install
    
    - name: Cache Rust toolchains
      # Restored BEFORE the toolchain is installed so the pinned stable, the MSRV, the general
      # pinned nightly (whose profile pulls rust-src, llvm-tools-preview and miri) and the dedicated
      # external-types nightly (minimal profile) are all served from cache, turning every
      # `rustup toolchain install` - the install step below and the ones inside `just install-tools` -
      # into a no-op on a hit. rust-cache below caches ~/.cargo and ./target but never ~/.rustup, so
      # re-installing these toolchains is the single largest uncached cost of this composite.
      #
      # It also means every toolchain is already present when Swatinem/rust-cache runs, so its
      # shared `prerequisites` key (which enumerates `rustup toolchain list`) reflects the
      # exact toolchain set. A deliberate bump of any pin then rebuilds that cache, which is
      # what we want.
      #
      # Keyed on OS + arch + a hash of the files that pin every toolchain version
      # (constants.env holds RUST_MSRV/RUST_NIGHTLY; rust-toolchain.toml holds the stable
      # channel), so any version bump invalidates the cache automatically. Unlike the
      # compiled cargo-tool binaries in ~/.cargo/bin, rustup toolchains are prebuilt,
      # relocatable artifacts that do not link against image-specific dylibs, so the runner
      # ImageVersion is deliberately left out of the key.
      uses: actions/cache@v6
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
        key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('constants.env', 'rust-toolchain.toml') }}

    - name: Install Rust toolchain
      # In-repo replacement for a marketplace toolchain action (scripts/setup/RustToolchain.psm1,
      # Pester-tested). It installs the pinned stable channel read from rust-toolchain.toml - the
      # single source of truth, never hardcoded - and wraps the `rustup toolchain install` in an
      # item-level retry, because that install pulls from package mirrors onto runner disks where a
      # transient fault (a network blip or a disk I/O error) is not a real failure and must not drop
      # the whole job. Owning the step also avoids a floating `@master` marketplace dependency.
      #
      # Pinning to the exact channel (rather than latest stable) keeps the installed toolchain set -
      # and thus Swatinem/rust-cache's key, which enumerates `rustup toolchain list` - stable until
      # we deliberately bump the pin, so an upstream stable release never silently busts the cache.
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        Import-Module ./scripts/setup/RustToolchain.psm1 -Force
        Install-RustToolchain

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        # We use the same shared key for all the different workflows that use this action.
        # This enables more reuse, e.g. the Copilot workflow can reuse artifacts from the
        # validate workflow, which speeds up copilot executions.
        shared-key: prerequisites
        # Include the runner image version (e.g. macos-15-arm64 20260511.0048.1) in the
        # cache key. Cached binaries can subtly depend on image-specific dylibs and tools,
        # so caches must not flow across image versions even when the lockfile and rust
        # toolchain are identical. ImageVersion is set automatically on every GitHub-hosted
        # runner. env-vars is additive on top of the rust-cache defaults.
        env-vars: ImageVersion

    - name: Cache actionlint and ShellCheck
      # just install-tools fetches pinned actionlint and ShellCheck as standalone binaries
      # (scripts/setup/install-actionlint.ps1, scripts/setup/install-shellcheck.ps1) into ~/.cargo/bin on
      # every job and every platform. Unlike the cargo-installed tools that also live there,
      # these are plain downloaded files with no cargo install-metadata, so Swatinem/rust-cache's
      # bin caching never tracks them and they are otherwise re-downloaded and re-extracted every
      # run. Caching the two binaries lets each script's "pinned version already present" check
      # short-circuit the download on a hit, so this step is restored before Install development
      # tools below (which runs install-tools).
      #
      # Keyed on OS + arch + a hash of the two install scripts, which embed both the pinned
      # versions and their published checksums - so bumping either tool invalidates the cache
      # automatically. Like rustup toolchains these are prebuilt, relocatable binaries that do not
      # link against image-specific dylibs, so the runner ImageVersion is deliberately left out of
      # the key.
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/actionlint*
          ~/.cargo/bin/shellcheck*
        key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup/install-actionlint.ps1', 'scripts/setup/install-shellcheck.ps1') }}

    - name: Install just
      shell: bash
      run: cargo install just --locked
    
    - name: Configure Git
      shell: bash
      run: git config --local include.path ./.gitconfig
    
    - name: Install development tools
      # Runs the exact install-tools recipe developers run locally, so the CI and local toolsets
      # never diverge and every tool version has a single source of truth (the recipe). Two tools
      # are trimmed here because no ordinary CI job needs them: azcopy is always skipped (only the
      # on-demand `just bench-history-stress-azure` uses it), and Azurite is skipped unless a job
      # opts in via install-azurite (the test-azurite job does) - its emulator install is not worth
      # the ~3 minutes on every other job.
      shell: bash
      env:
        INSTALL_AZURITE: ${{ inputs.install-azurite }}
      run: |
        if [ "$INSTALL_AZURITE" = "true" ]; then
          SKIP_AZURITE=false
        else
          SKIP_AZURITE=true
        fi
        just skip_azcopy=true skip_azurite="$SKIP_AZURITE" install-tools
    
    - name: Verify environment setup
      shell: bash
      env:
        INSTALL_VALGRIND: ${{ inputs.install-valgrind }}
      run: |
        echo "Verifying installed tools..."
        just --version
        cargo --version
        rustc --version
        pwsh --version
        if [ "$RUNNER_OS" = "Linux" ]; then
          # Prove the APT packages restored from the cache are functional. valgrind is the one
          # that matters: a fileset-only cache restore could leave its shared libraries
          # unregistered, or leave detached glibc debug symbols that no longer match the
          # image's libc6 - so actually run it against a trivial program rather than only
          # printing a version, failing here rather than hours later inside a benchmark run.
          # Checked only where a job opted in, since valgrind is not installed otherwise.
          cmake --version
          if [ "$INSTALL_VALGRIND" = "true" ]; then
            valgrind --quiet --error-exitcode=1 /bin/true
          fi
        fi
        echo "Environment setup complete"
