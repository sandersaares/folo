[package]
# Cargo's binary-package naming convention uses dashes.
name = "cargo-release-plan"
description = "A Cargo subcommand that classifies publishable packages against their version anchors and applies increment plans"
publish = true
version = "0.1.3"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Only the consumer build and declared benchmark target ship in the published
# source package. Tests, the agent notes, and development manifests stay in git.
# Cargo packs the README it detects whatever this says, so naming it here would
# only imply otherwise.
# Ref: docs/design.md, "Where Cargo adds content".
include = ["src/**", "benches/cargo_release_plan_algorithms.rs"]

# Required so feature-gated public items appear in generated documentation.
# Ref: docs/api-documentation.md, "Feature-gated documentation".
[package.metadata.docs.rs]
all-features = true

# The benchmark target requires `private-test-util`. `cargo udeps` does not
# enable features, so it skips the target and cannot observe this dependency.
[package.metadata.cargo-udeps.ignore]
development = ["criterion"]

# Baseline of external types intentionally exposed in the public API. Any new
# external type here causes the check to fail so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
]

[package.metadata.binstall]
# Prebuilt binaries are published by .github/workflows/release.yml, and these
# keys must resolve to exactly the assets that workflow uploads: cargo-binstall
# cannot derive them, because release-plz tags releases under a scheme its
# auto-detection does not know and the release matrix uses one archive format on
# every platform. Ref: docs/release-automation.md, asset-naming contract.
# `bin-dir` is spelled out because the archive has no versioned inner directory.
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[features]
# Internal-only API surface for in-workspace benchmarks.
private-test-util = []

[dependencies]
clap = { workspace = true, features = ["derive"] }
ignore = { workspace = true }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml_edit = { workspace = true, features = ["parse", "display"] }

[dev-dependencies]
criterion = { workspace = true }
mutants = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "cargo_release_plan_algorithms"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true
