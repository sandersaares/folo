[package]
name = "cpulist"
description = "Parse and emit the Linux 'cpulist' data format used to list processors, memory regions and similar entities"
publish = true
version = "1.1.9"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["ohno::enrichable::Enrichable", "ohno::error_ext::ErrorExt"]

[features]
default = []

[dependencies]
itertools = { workspace = true }
new_zealand = { workspace = true }
ohno = { workspace = true }

[dev-dependencies]
static_assertions = { workspace = true }

[lints]
workspace = true
