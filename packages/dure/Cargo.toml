[package]
name = "dure"
description = "Detachable Windows console sessions that outlive the terminal"
publish = true
version = "0.3.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Only what builds the source, plus the landing page crates.io renders. The guides under `docs/`
# are written for maintainers of this repository and link to repository-root documents that no
# crate archive carries, so a packaged copy could not be followed to a complete picture anyway.
include = ["Cargo.toml", "README.md", "src/**/*"]

# `dure` is a command-line tool; its Rust API exists only so the in-package binary and the
# integration tests can reach the crate, and every exported item is therefore `#[doc(hidden)]`
# (see `src/lib.rs`). Documenting the Windows targets is what keeps the rendered page the tool's
# own introduction rather than an empty Linux build, where `#![cfg(windows)]` removes the crate.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

# The release workflow publishes prebuilt archives under release-plz's `<crate>-v<version>` tag,
# which cargo-binstall cannot derive on its own. Ref: docs/release-automation.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

# A non-Windows build compiles to a stub that only reports the unsupported platform
# (docs/implementation.md, "Platform gate"), so a prebuilt archive for any other target would
# install a binary that can never run. Ref: docs/release-automation.md, "Per-crate targets".
[package.metadata.folo]
release-targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

# The Windows integration tests are gated behind `private-test-util`, so a default-feature build
# compiles none of them and the helper they drive looks unused. Same reason as `many_cpus`.
[package.metadata.cargo-udeps.ignore]
development = ["dure-test-helper"]

# External types intentionally exposed in the public API. The check fails when a public external
# type matches no entry, so an accidental exposure is caught by being absent from this list.
#
# The list is empty because the package has no supported API: every exported item is
# `#[doc(hidden)]` (see `src/lib.rs`), so nothing is advertised for anyone to depend on. An entry
# here would mean a decision to expose something, which is a decision this package does not make.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = []

[features]
# Exposes the in-crate test support the Windows integration tests use to drive
# the real PAL. It does not alter the `dure` command-line interface.
private-test-util = []

# Every dependency is Windows-only because the crate itself is: a non-Windows build compiles to a
# stub that only reports the unsupported platform (docs/implementation.md, "Platform gate"), so
# declaring them unconditionally would make them genuinely unused there.
[target.'cfg(windows)'.dependencies]
clap = { workspace = true, features = ["derive"] }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# The non-Windows stub carries a mutation skip of its own, so unlike every other
# dependency this one is named on both platforms.
[dev-dependencies]
mutants = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
dure-test-helper = { path = "../dure-test-helper" }
mockall = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }
testing = { path = "../testing" }

# The end-to-end Windows suite needs the test support above, which is not part of the product and
# is therefore behind a feature. Both suites execute a repository test binary whose isolated-store
# argument is compiled with `cfg(dure_integration_test)`, set by the standard `just test`,
# coverage, careful, and mutation recipes. Their harnesses report that requirement directly if
# invoked through Cargo without the cfg. The package's own validation enables all features and
# the cfg, so both suites always run there.
[[test]]
name = "windows"
required-features = ["private-test-util"]

[[test]]
name = "cli"
required-features = ["private-test-util"]

[lints]
workspace = true
