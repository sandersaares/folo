[package]
name = "future_deque"
description = "Deque collections for managing groups of futures"
publish = true
version = "0.1.21"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["futures_core::stream::Stream"]

[features]
futures-stream = ["dep:futures-core"]

[dependencies]
futures-core = { workspace = true, optional = true }
plurality = { workspace = true }

[dev-dependencies]
all_the_time = { path = "../all_the_time" }
alloc_tracker = { path = "../alloc_tracker" }
criterion = { workspace = true }
events_once = { path = "../events_once" }
futures = { workspace = true, features = ["executor"] }
futures-core = { workspace = true }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[lints]
workspace = true

[[bench]]
name = "future_deque"
harness = false

[[bench]]
name = "future_deque_cg"
harness = false
