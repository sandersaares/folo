[package]
# Cargo expects dashes in tool-style crate names. Okay.
name = "dure-test-helper"
description = "Child process and binary locator used by the dure Windows integration tests"
publish = false
version = "0.0.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Windows-only for the same reason the helper itself is (see `dure/docs/implementation.md`,
# "Platform gate"): a non-Windows build compiles to an empty stub.
[target.'cfg(windows)'.dependencies]
serde_json = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
