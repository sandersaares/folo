[package]
name = "nm_otel_impl"
description = "Implementation crate for nm_otel; do not depend on it directly"
publish = true
version = "0.4.22"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["opentelemetry::metrics::meter::MeterProvider", "tick::clock::Clock"]

# These dev-dependencies are consumed only by test and benchmark targets that require
# `private-test-util`. When udeps runs without `--all-features`, the targets are skipped, so the
# development dependencies appear unused.
# Ignore them here to silence false positives.
[package.metadata.cargo-udeps.ignore]
development = [
    "alloc_tracker",
    "criterion",
    "gungraun",
    "many_cpus",
    "new_zealand",
    "nm_otel",
    "par_bench",
]

[package.metadata.release-plan]
# Implementation partition of `nm_otel`; consumers reach this surface through
# that package, which is where its compatibility is assessed.
private-api = true

[lib]
# nm_otel_impl exists only to host the implementation of `nm_otel` and to expose
# internal items to in-workspace tests and benchmarks; user-facing documentation lives in
# `nm_otel`.
doc = false

[features]
# Internal-only API surface for in-workspace tests and benchmarks. Never
# forwarded by the `nm_otel` shell crate, so end-user builds never see these
# items. See docs/impl-crate-split.md for the `test-util` vs
# `private-test-util` distinction.
private-test-util = ["dep:opentelemetry_sdk"]

[dependencies]
futures = { workspace = true }
hashbrown = { workspace = true, features = ["inline-more"] }
nm = { workspace = true }
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, optional = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
tick = { workspace = true }

[dev-dependencies]
alloc_tracker = { path = "../alloc_tracker" }
criterion = { workspace = true }
many_cpus = { path = "../many_cpus" }
mutants = { workspace = true }
new_zealand = { path = "../new_zealand" }
nm_impl = { path = "../nm_impl", features = ["private-test-util"] }
# `nm_otel` is a development dependency so doctests, examples, and benches can write
# `use nm_otel::Publisher;` exactly as user code would, matching the documentation
# rendered for `nm_otel`. This forms an allowed dev-dependency-only cycle.
nm_otel = { path = "../nm_otel" }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
    "testing",
] }
par_bench = { path = "../par_bench", features = ["alloc_tracker", "criterion"] }
static_assertions = { workspace = true }
testing = { path = "../testing" }
tick = { workspace = true, features = ["tokio", "test-util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

# Gungraun drives Valgrind-based Callgrind benchmarks; Linux-only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[[test]]
name = "nm_otel_histogram_deltas_alloc"
required-features = ["private-test-util"]

[[test]]
name = "nm_otel_publish_forever"
required-features = ["private-test-util"]

[[test]]
name = "nm_otel_run_one_iteration"
required-features = ["private-test-util"]

[[test]]
name = "nm_otel_run_one_iteration_deltas"
required-features = ["private-test-util"]

[[bench]]
name = "nm_otel_export"
harness = false
required-features = ["private-test-util"]

[[bench]]
name = "nm_otel_export_cg"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true
