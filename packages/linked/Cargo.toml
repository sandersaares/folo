[package]
name = "linked"
description = "Create families of linked objects that can collaborate across threads while being internally single-threaded"
publish = true
version = "1.0.23"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The diagrams are embedded into the rendered documentation at compile time.
# Ref: docs/packaging.md.
include = ["src/**/*", "doc/**/*"]

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API.
# `linked` re-exports macro-support internals from its companion `linked_macros`
# crate, so those are by-design layering, not accidental exposure.
# Ref: docs/external-types.md; docs/impl-crate-split.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["linked_macros::*"]

[features]
default = []

[dependencies]
hash_hasher = { workspace = true }
linked_macros = { workspace = true }
pastey = { workspace = true }
simple-mermaid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
many_cpus = { path = "../many_cpus" }
mutants = { workspace = true }
new_zealand = { path = "../new_zealand" }
par_bench = { path = "../par_bench", features = ["criterion"] }
seq-macro = { workspace = true }
static_assertions = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[[bench]]
name = "linked_instances"
harness = false

[[bench]]
name = "linked_instance_per_thread"
harness = false

[[bench]]
name = "linked_instance_per_thread_sync"
harness = false

[[bench]]
name = "linked_static_thread_local_arc"
harness = false

[[bench]]
name = "linked_static_thread_local_rc"
harness = false

[[bench]]
name = "linked_instance_per_thread_cg"
harness = false

[lints]
workspace = true







