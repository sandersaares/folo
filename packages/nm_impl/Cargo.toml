[package]
name = "nm_impl"
description = "Implementation crate for nm; do not depend on it directly"
publish = true
version = "0.1.49"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["num_traits::cast::AsPrimitive"]

[package.metadata.release-plan]
# Implementation partition of `nm`; consumers reach this surface through that
# package, which is where its compatibility is assessed.
private-api = true

[lib]
# nm_impl exists only to host the implementation of `nm` and to expose internal
# items to in-workspace tests and benchmarks; user-facing documentation lives in `nm`.
doc = false

[features]
# Internal-only API surface for in-workspace tests and benchmarks. Never
# forwarded by the `nm` shell crate, so end-user builds never see these items.
# See docs/impl-crate-split.md for the `test-util` vs `private-test-util`
# distinction.
private-test-util = []

[dependencies]
fast_time = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
many_cpus = { path = "../many_cpus" }
mutants = { workspace = true }
new_zealand = { path = "../new_zealand" }
# `nm` is a development dependency so doctests, examples, and benchmarks can write
# `use nm::Event;` exactly as user code would, matching the documentation rendered for `nm`.
nm = { path = "../nm" }
par_bench = { path = "../par_bench", features = ["criterion"] }
static_assertions = { workspace = true }
testing = { path = "../testing" }

# Gungraun drives Valgrind-based Callgrind benchmarks; Linux-only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[lints]
workspace = true

[[bench]]
name = "nm_performance"
harness = false

[[bench]]
name = "nm_push_bulk"
harness = false

[[bench]]
name = "nm_rendering"
harness = false
required-features = ["private-test-util"]

[[bench]]
name = "nm_rendering_cg"
harness = false
required-features = ["private-test-util"]

[[bench]]
name = "nm_performance_cg"
harness = false
