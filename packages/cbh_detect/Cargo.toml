[package]
# Cargo has its own logic for naming and expects dashes for the `cargo-bench-history`
# binary, but its internal implementation crates use the short `cbh_` underscore prefix.
name = "cbh_detect"
description = "Implementation crate for cargo-bench-history - do not reference directly"
publish = true
version = "0.2.10"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "anyspawn::spawner::Spawner",
    "cbh_model::benchmark_id::BenchmarkId",
    "cbh_model::benchmark_id::BenchmarkIdPrefix",
    "cbh_model::bless::BlessingRecord",
    "cbh_model::comparability::DiscriminantSet",
    "cbh_model::comparability::StorageKey",
    "cbh_model::metric::MetricKind",
    "cbh_model::run::Run",
    "jiff::timestamp::Timestamp",
    "nonempty::NonEmpty",
    "serde_core::de::Deserialize",
    "serde_core::ser::Serialize",
    "serde_json::error::Error",
    "smallvec::SmallVec",
]

[package.metadata.release-plan]
# Implementation partition of `cargo-bench-history`; consumers reach this surface
# through that package, which is where its compatibility is assessed.
private-api = true

[lib]
# This is an implementation crate whose surface is documented on `cargo-bench-history`.
doc = false

[features]
# Internal-only API surface for in-workspace tests and documentation figures: the
# `testing::synchronous_spawner` the `cargo-bench-history` shell crate's tests (and this
# crate's own tests) inject in place of the production Tokio spawner, so neither needs a
# Tokio runtime, and the `examples` catalogue of named series, series/context builders and
# scatter helpers that the documentation figures render and the tests assert on. Never
# forwarded by the shell crate, so end-user builds never see it. See
# docs/impl-crate-split.md for the `test-util` vs `private-test-util` distinction.
private-test-util = ["dep:thread_aware"]

[dependencies]
anyspawn = { workspace = true }
cbh_model = { workspace = true }
cbh_stats = { workspace = true }
foldhash = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher", "inline-more"] }
jiff = { workspace = true, features = ["serde"] }
nonempty = { workspace = true, features = ["serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true, features = ["serde"] }
thread_aware = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true, features = ["executor"] }
mutants = { workspace = true }

[[bench]]
name = "cbh_detect_branch"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true
