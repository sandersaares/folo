[package]
name = "many_cpus_benchmarking"
description = "Criterion benchmark harness to easily compare different processor configurations"
publish = true
version = "0.2.10"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["criterion::Criterion"]

[features]
default = []

[dependencies]
cpulist = { workspace = true }
criterion = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
itertools = { workspace = true }
many_cpus = { workspace = true }
new_zealand = { workspace = true }
nonempty = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
static_assertions = { workspace = true }

[[bench]]
name = "many_cpus_benchmarking_harness_demo"
harness = false

[lints]
workspace = true

