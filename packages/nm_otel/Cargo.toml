[package]
name = "nm_otel"
description = "OpenTelemetry bridge for nm metrics"
publish = true
version = "0.4.21"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API.
# `nm_otel` is the public shell over its own `nm_otel_impl` partition, so
# re-exporting its implementation types is the deliberate package boundary.
# Ref: docs/external-types.md; docs/impl-crate-split.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["nm_otel_impl::*"]

[dependencies]
nm_otel_impl = { workspace = true }

[dev-dependencies]
# The user-facing examples create nm events and publish them through a configured
# OpenTelemetry SDK provider.
nm = { path = "../nm" }
opentelemetry-stdout = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
static_assertions = { workspace = true }
tick = { workspace = true, features = ["tokio", "test-util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
