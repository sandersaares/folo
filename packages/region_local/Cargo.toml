[package]
name = "region_local"
description = "Isolated variable storage per memory region, similar to `thread_local_rc!`"
publish = true
version = "1.0.36"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The diagrams are embedded into the rendered documentation at compile time.
# Ref: docs/packaging.md.
include = ["src/**/*", "doc/**/*"]

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "linked::family::Family",
    "linked::object::Object",
    "many_cpus_impl::system_hardware::SystemHardware",
]

[features]
default = []

[dependencies]
arc-swap = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
linked = { workspace = true }
many_cpus = { workspace = true }
rsevents = { workspace = true }
scopeguard = { workspace = true }
simple-mermaid = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
criterion = { workspace = true }
many_cpus = { path = "../many_cpus", features = ["test-util"] }
mutants = { workspace = true }
new_zealand = { path = "../new_zealand" }
par_bench = { path = "../par_bench", features = ["criterion"] }
static_assertions = { workspace = true }
testing = { path = "../testing" }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[[bench]]
name = "region_local"
harness = false

[[bench]]
name = "region_local_cg"
harness = false

[lints]
workspace = true

