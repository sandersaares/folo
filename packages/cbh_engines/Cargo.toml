[package]
# Cargo has its own logic for naming and expects dashes for the `cargo-bench-history`
# binary, but its internal implementation crates use the short `cbh_` underscore prefix.
name = "cbh_engines"
description = "Implementation crate for cargo-bench-history - do not reference directly"
publish = true
version = "0.2.8"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The fixtures are embedded by `src/testing.rs` at compile time under the
# `private-test-util` feature, which cannot compile without them.
# Ref: docs/packaging.md.
include = ["src/**/*", "tests/fixtures/**/*"]

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "cbh_diag::report::Reporter",
    "cbh_model::comparability::Engine",
    "cbh_model::run::BenchmarkResult",
    "ohno::enrichable::Enrichable",
    "ohno::error_ext::ErrorExt",
]

[package.metadata.release-plan]
# Implementation partition of `cargo-bench-history`; consumers reach this surface
# through that package, which is where its compatibility is assessed.
private-api = true

[lib]
# This is an implementation crate whose surface is documented on `cargo-bench-history`.
doc = false

[features]
# Internal-only API surface for in-workspace tests: the committed parser fixtures
# that other crates' tests (and this crate's own tests) use instead of embedding a
# second compile-time copy. Never forwarded by the shell crate, so end-user builds
# never see it. See docs/impl-crate-split.md for the `test-util` vs
# `private-test-util` distinction.
private-test-util = []

[dependencies]
cbh_diag = { workspace = true }
cbh_model = { workspace = true }
jiff = { workspace = true }
nonempty = { workspace = true }
ohno = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
all_the_time = { path = "../all_the_time" }
alloc_tracker = { path = "../alloc_tracker" }
cbh_diag = { path = "../cbh_diag", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
