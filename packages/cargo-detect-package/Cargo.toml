[package]
# Cargo has its own logic for naming and expects dashes. Okay.
name = "cargo-detect-package"
description = "A Cargo tool to detect the package that a file belongs to, passing the package name to a subcommand"
publish = true
version = "1.0.34"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
]

[package.metadata.binstall]
# Prebuilt binaries are published by .github/workflows/release.yml (see
# docs/release-automation.md). release-plz tags releases as `<crate>-v<version>`,
# which cargo-binstall's auto-detection does not derive, so the URL is explicit.
# Archives are `.zip` on every platform and the binary sits at the archive root.
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[dependencies]
clap = { workspace = true, features = ["derive"] }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
toml = { workspace = true, features = ["parse", "serde"] }

[dev-dependencies]
mockall = { workspace = true }
mutants = { workspace = true }
serial_test = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
