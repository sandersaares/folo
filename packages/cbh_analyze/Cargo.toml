[package]
# Cargo has its own logic for naming and expects dashes for the `cargo-bench-history`
# binary, but its internal implementation crates use the short `cbh_` underscore prefix.
name = "cbh_analyze"
description = "Implementation crate for cargo-bench-history - do not reference directly"
publish = true
version = "0.2.3"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "cbh_command::command::AnalyzeOptions",
    "cbh_command::command::BlessOptions",
    "cbh_command::command::ExamineOptions",
    "cbh_command::command::ListOptions",
    "cbh_command::command::PruneOptions",
    "cbh_command::command::UnblessOptions",
    "cbh_config::error::ConfigError",
    "cbh_detect::detect::findings::AnalysisMode",
    "cbh_storage::error::StorageError",
    "cbh_storage::facade::StorageFacade",
    "ohno::enrichable::Enrichable",
    "ohno::error_ext::ErrorExt",
    "tick::clock::Clock",
]

[package.metadata.release-plan]
# Implementation partition of `cargo-bench-history`; consumers reach this surface
# through that package, which is where its compatibility is assessed.
private-api = true

[lib]
# This is an implementation crate whose surface is documented on `cargo-bench-history`.
doc = false

[dependencies]
anyspawn = { workspace = true, features = ["tokio"] }
cbh_command = { workspace = true }
cbh_config = { workspace = true }
cbh_detect = { workspace = true }
cbh_diag = { workspace = true }
cbh_git = { workspace = true }
cbh_model = { workspace = true }
cbh_probe = { workspace = true }
cbh_render = { workspace = true }
cbh_storage = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
nonempty = { workspace = true }
ohno = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tick = { workspace = true, features = ["tokio"] }

[dev-dependencies]
cbh_detect = { path = "../cbh_detect", features = ["private-test-util"] }
cbh_diag = { path = "../cbh_diag", features = ["private-test-util"] }
cbh_git = { path = "../cbh_git", features = ["private-test-util"] }
cbh_storage = { path = "../cbh_storage", features = ["private-test-util"] }
futures = { workspace = true, features = ["executor"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
tick = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
