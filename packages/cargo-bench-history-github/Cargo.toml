[package]
name = "cargo-bench-history-github"
description = "Unsupported GitHub automation companion for cargo-bench-history; no stable API or CLI"
publish = true
version = "0.2.6"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
    "ohno::app::error::AppError",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.release-plan]
private-api = true

[[bin]]
name = "cargo-bench-history-github"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "time"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
mutants = { workspace = true }
static_assertions = { workspace = true }

[lints]
workspace = true
